<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Share</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <style>
    #map {
      height: 90vh;
    }
  </style>
  <body>
    <div id="map"></div>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let map = L.map("map").setView([51.505, -0.09], 13);
      const socket = io();

      const remoteMarkers = new Map();

      socket.on("server:location:update", (data) => {
        const { id, latitude, longitude } = data;
        if (!remoteMarkers.has(id)) {
          const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(`${id} is here`);
          remoteMarkers.set(id, marker);
        } else {
          const existingMarker = remoteMarkers.get(id);
          existingMarker.setLatLng([latitude, longitude]);
        }
      });

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function getUserLocation() {
        return new Promise((resolve, reject) => {
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                resolve({ latitude, longitude });
              },
              (error) => {
                reject(error);
              },
              { enableHighAccuracy: true },
            );
          } else {
            alert("geolocation is not available");
          }
        });
      }

      let myCurrentLocation = null;

      async function main() {
        const userLocation = await getUserLocation();
        setInterval(async () => {
          const { latitude, longitude } = await getUserLocation();
          console.log(latitude, longitude);
          socket.emit("client:location:update", { latitude, longitude });

          if (!myCurrentLocation) {
            myCurrentLocation = L.marker([
              userLocation.latitude,
              userLocation.longitude,
            ])
              .addTo(map)
              .bindPopup("you are here");
          } else {
            myCurrentLocation.setLatLng([latitude, longitude]);
          }
        }, 10000);
      }

      window.addEventListener("load", main);
    </script>
  </body>
</html>
